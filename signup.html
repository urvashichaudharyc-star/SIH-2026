<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Swadeshi Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">Swadeshi Bazaar</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="cart.html" id="cart-link">Bag (<span id="cart-count">0</span>)</a></li>
      <li id="auth-nav-item"><a href="login.html">Log in</a></li>
    </ul>
  </nav>

  <section id="auth-section">
    <div class="auth-box">
      <h1>Create an account</h1>

      <div class="auth-tabs">
        <button class="auth-tab active-tab" data-role="buyer">Buyer</button>
        <button class="auth-tab" data-role="artisan">Artisan</button>
      </div>

      <form id="signup-form">
        <label for="signup-name">Full name</label>
        <input type="text" id="signup-name" required>

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required>

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required>

        <div id="artisan-only-fields" style="display:none;">
          <label for="signup-craft">Craft / specialty</label>
          <input type="text" id="signup-craft" placeholder="e.g. Blue pottery">

          <label for="signup-region">Region</label>
          <input type="text" id="signup-region" placeholder="e.g. Jaipur, Rajasthan">
        </div>

        <button type="submit" id="signup-submit">Sign up as Buyer</button>
        <p id="signup-status"></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
