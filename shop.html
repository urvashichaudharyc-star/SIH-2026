<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Swadeshi Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <nav>
  <div class="logo">Swadeshi Bazaar</div>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="add-product.html">Add Product</a></li>
    <li><a href="cart.html" id="cart-link">Bag (<span id="cart-count">0</span>)</a></li>

  </ul>

  <section id="shop-header">
    <h1>Fresh from the workshops this week</h1>
    <p>Every piece here is signed by the hand that made it.</p>
  </section>
    <section id="shop-filters">
    <input type="text" id="search-input" placeholder="Search products...">

    <select id="filter-region">
      <option value="">All regions</option>
      <option value="Rajasthan">Rajasthan</option>
      <option value="Telangana">Telangana</option>
      <option value="Karnataka">Karnataka</option>
    </select>

    <select id="sort-price">
      <option value="">Sort by</option>
      <option value="low-high">Price: Low to High</option>
      <option value="high-low">Price: High to Low</option>
    </select>
  </section>

   <section id="shop-grid">
    <div class="product-grid" id="product-grid-container"></div>
  </section>

  <script src="main.js"></script>
</body>
</html>
