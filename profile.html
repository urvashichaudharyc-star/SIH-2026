<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile — Swadeshi Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <nav>
  <div class="logo">Swadeshi Bazaar</div>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="add-product.html">Add Product</a></li>
    <li><a href="cart.html" id="cart-link">Bag (<span id="cart-count">0</span>)</a></li>
    <li id="auth-nav-item"><a href="login.html">Log in</a></li>
  </ul>
</nav>

  <section id="profile-section">
    <div id="profile-locked" style="display:none;">
      <p>Please log in to view your profile.</p>
      <a href="login.html" class="btn-primary">Log in</a>
    </div>

    <div id="profile-content" style="display:none;">
      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar"></div>
        <div>
          <h1 id="profile-name"></h1>
          <p id="profile-email"></p>
          <span class="profile-role" id="profile-role"></span>
          <p class="profile-craft" id="profile-craft" style="display:none;"></p>
        </div>
      </div>

      <h2>Your orders</h2>
      <div id="orders-list"></div>
      <div id="orders-empty" style="display:none;">
        <p>You haven't placed any orders yet.</p>
        <a href="shop.html" class="btn-primary">Browse the shop</a>
      </div>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
