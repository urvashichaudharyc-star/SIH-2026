<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Swadeshi Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
  <div class="logo">Swadeshi Bazaar</div>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="add-product.html">Add Product</a></li>
    <li><a href="cart.html" id="cart-link">Bag (<span id="cart-count">0</span>)</a></li>
    <li id="auth-nav-item"><a href="login.html">Log in</a></li>
  </ul>
</nav>
  <section id="auth-section">
    <div class="auth-box">
      <h1>Log in</h1>

      <div class="auth-tabs">
        <button class="auth-tab active-tab" data-role="buyer">Buyer</button>
        <button class="auth-tab" data-role="artisan">Artisan</button>
      </div>

      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>

        <button type="submit" id="login-submit">Log in as Buyer</button>
        <p id="login-status"></p>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
