<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Swadeshi Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">Swadeshi Bazaar</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="cart.html" id="cart-link">Bag (<span id="cart-count">0</span>)</a></li>
      <li id="auth-nav-item"><a href="login.html">Log in</a></li>
    </ul>
  </nav>

  <section id="product-detail">
    <div id="product-not-found" style="display:none;">
      <p>We couldn't find that product.</p>
      <a href="shop.html" class="btn-primary">Back to shop</a>
    </div>

    <div id="product-content" style="display:none;">
      <div class="product-detail-grid">
        <div class="product-detail-media" id="pd-media"></div>

        <div class="product-detail-info">
          <span class="product-origin" id="pd-origin"></span>
          <h1 id="pd-name"></h1>
          <p class="product-detail-price" id="pd-price"></p>
          <p class="product-detail-desc" id="pd-desc"></p>
          <button id="pd-add-to-bag">Add to bag</button>
        </div>
      </div>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
