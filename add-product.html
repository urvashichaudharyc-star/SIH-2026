<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Product — Swadeshi Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo">Swadeshi Bazaar</div>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="add-product.html">Add Product</a></li>
    <li><a href="cart.html" id="cart-link">Bag (<span id="cart-count">0</span>)</a></li>
    <li id="auth-nav-item"><a href="login.html">Log in</a></li>
  </ul>
</nav>
  <section id="add-product-header">
    <h1>Add a new product</h1>
    <p>Snap a photo — we'll help with the rest.</p>
  </section>

  <section id="camera-section">
    <video id="camera-preview" autoplay playsinline></video>
    <canvas id="photo-canvas" style="display:none;"></canvas>
    <img id="captured-photo" style="display:none;" alt="Captured product photo">


    <div id="camera-controls">
      <button id="start-camera">Open camera</button>
      <button id="capture-photo" style="display:none;">Capture</button>
      <button id="retake-photo" style="display:none;">Retake</button>
    </div>

    <p id="camera-status"></p>
  </section>
    <section id="voice-section">
    <h2>Describe it by voice</h2>
    <p>Tap the mic and speak — in Hindi, English, or your local language.</p>

    <select id="voice-language">
      <option value="hi-IN">Hindi</option>
      <option value="en-IN">English (India)</option>
      <option value="ta-IN">Tamil</option>
      <option value="bn-IN">Bengali</option>
    </select>

    <button id="start-mic">🎤 Start speaking</button>

    <textarea id="voice-transcript" rows="4" placeholder="What you say will appear here..."></textarea>

    <p id="mic-status"></p>
  </section>
    <section id="submit-section">
    <label for="product-name">Product name</label>
    <input type="text" id="product-name" placeholder="e.g. Blue pottery lamp">

    <label for="product-price">Price (₹)</label>
    <input type="number" id="product-price" placeholder="e.g. 1200">

    <button id="submit-product">Submit product</button>
    <p id="submit-status"></p>
  </section>

  <script src="main.js"></script>
</body>
</html>
